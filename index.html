<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanDeck — Shared Chore Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --accent-amber: #f59e0b;
      --border-color: #e2e8f0;
      --radius: 16px;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 20px 16px 80px 16px; max-width: 500px; margin: 0 auto; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-top: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { background: var(--primary); color: white; padding: 10px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 1.35rem; font-weight: 800; }
    .tagline { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
    
    .header-actions { display: flex; gap: 6px; }
    .btn-header { background: var(--primary-light); color: var(--primary); border: none; height: 42px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 0.82rem; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-header.icon-only { width: 42px; padding: 0; justify-content: center; }

    .user-bar { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem; font-weight: 600; }
    .user-badge { background: var(--primary-light); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-weight: 700; }

    .section-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .top-3-container { margin-bottom: 28px; }

    .task-card { background: var(--card-bg); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .task-info { flex: 1; padding-right: 12px; }
    .task-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; color: var(--text-main); }
    .task-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .complete-btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    .toggle-all-btn { width: 100%; background: transparent; border: 1px dashed var(--border-color); padding: 12px; border-radius: 12px; color: var(--text-muted); font-size: 0.88rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.95rem; }
    .form-group textarea { height: 120px; resize: none; }

    .submit-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .action-icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; opacity: 0.8; padding: 2px; display: flex; align-items: center; gap: 4px; font-size: 0.78rem; font-weight: 600; }
    .action-icon-btn:hover { opacity: 1; color: var(--primary); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon"><i data-lucide="sparkles"></i></div>
      <div>
        <h1>CleanDeck</h1>
        <div class="tagline">Shared Chore Tracker</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-header" onclick="openCalendarModal()"><i data-lucide="calendar"></i> History</button>
      <button class="btn-header" onclick="openBulkModal()"><i data-lucide="layers"></i> Bulk Add</button>
      <button class="btn-header icon-only" onclick="openSingleModal()"><i data-lucide="plus"></i></button>
    </div>
  </header>

  <!-- User Identifier Bar -->
  <div class="user-bar">
    <div>Logged in as: <span class="user-badge" id="current-user-display">Guest</span></div>
    <button class="action-icon-btn" onclick="openUserModal()"><i data-lucide="user"></i> Switch User</button>
  </div>

  <!-- Top 3 Priority -->
  <section class="top-3-container">
    <div class="section-title"><i data-lucide="zap" style="color: var(--accent-amber);"></i> Recommended Tasks</div>
    <div id="top-3-list"></div>
  </section>

  <!-- All Tasks -->
  <section>
    <button class="toggle-all-btn" onclick="toggleAllTasks()">
      <span id="toggle-text">Show All Other Tasks</span>
      <i data-lucide="chevron-down" id="toggle-icon"></i>
    </button>
    <div id="all-tasks-container" style="display: none;">
      <div class="section-title"><i data-lucide="list"></i> All Chores</div>
      <div id="all-tasks-list"></div>
    </div>
  </section>

  <!-- Switch User Modal -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 style="font-size: 1.15rem; font-weight: 700;">Who is completing tasks?</h2>
        <button class="action-icon-btn" onclick="closeModals()"><i data-lucide="x"></i></button>
      </div>
      <form onsubmit="handleUserSubmit(event)">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="user-name-input" placeholder="e.g. Alex, Sam, Jordan" required>
        </div>
        <button type="submit" class="submit-btn">Set Name</button>
      </form>
    </div>
  </div>

  <!-- Single Task Modal -->
  <div class="modal-overlay" id="single-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title" style="font-size: 1.15rem; font-weight: 700;">Add New Chore</h2>
        <button class="action-icon-btn" onclick="closeModals()"><i data-lucide="x"></i></button>
      </div>
      <form id="single-form" onsubmit="handleSingleSubmit(event)">
        <input type="hidden" id="edit-task-id">
        <div class="form-group">
          <label>Chore Name</label>
          <input type="text" id="task-name" placeholder="e.g. Clean Oven" required>
        </div>
        <div class="form-group">
          <label>Repeat Frequency (Days)</label>
          <input type="number" id="task-interval" min="1" placeholder="e.g. 14" required>
        </div>
        <div class="form-group">
          <label>Last Done Date</label>
          <input type="date" id="task-lastdone" required>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="task-priority" style="width: auto;">
          <label for="task-priority" style="margin-bottom: 0;">★ High Priority (Jump to top when overdue)</label>
        </div>
        <button type="submit" class="submit-btn" id="single-submit-btn">Save Chore</button>
      </form>
    </div>
  </div>

  <!-- Bulk Add Modal -->
  <div class="modal-overlay" id="bulk-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 style="font-size: 1.15rem; font-weight: 700;">Bulk Add Chores</h2>
        <button class="action-icon-btn" onclick="closeModals()"><i data-lucide="x"></i></button>
      </div>
      <form onsubmit="handleBulkSubmit(event)">
        <div class="form-group">
          <label>List of Chores (One chore per line)</label>
          <textarea id="bulk-names" placeholder="Vacuum Rugs&#10;Mop Floors&#10;Wipe Baseboards&#10;Clean Windows" required></textarea>
        </div>
        <div class="form-group">
          <label>Default Frequency for All (Days)</label>
          <input type="number" id="bulk-interval" value="14" min="1" required>
        </div>
        <div class="form-group">
          <label>Set Last Done Date for All</label>
          <input type="date" id="bulk-lastdone" required>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="bulk-priority" style="width: auto;">
          <label for="bulk-priority" style="margin-bottom: 0;">★ Mark all as High Priority</label>
        </div>
        <button type="submit" class="submit-btn">Import All Chores</button>
      </form>
    </div>
  </div>

  <!-- Calendar History Modal -->
  <div class="modal-overlay" id="calendar-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 style="font-size: 1.15rem; font-weight: 700;">Completion History</h2>
        <button class="action-icon-btn" onclick="closeModals()"><i data-lucide="x"></i></button>
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <button class="action-icon-btn" onclick="changeMonth(-1)"><i data-lucide="chevron-left"></i> Prev</button>
        <strong id="calendar-month-year" style="font-size: 0.95rem;"></strong>
        <button class="action-icon-btn" onclick="changeMonth(1)">Next <i data-lucide="chevron-right"></i></button>
      </div>

      <div id="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 0.8rem; margin-bottom: 12px;"></div>
      
      <div id="day-log-container" style="border-top: 1px solid var(--border-color); padding-top: 12px;">
        <div style="font-size: 0.85rem; font-weight: 700; margin-bottom: 6px;" id="selected-date-title">Select a day to view history</div>
        <div id="selected-date-tasks" style="font-size: 0.82rem; color: var(--text-muted);"></div>
      </div>
    </div>
  </div>

  <!-- Firebase Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
    // PASTE YOUR FIREBASE KEYS HERE:
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    let isFirebaseConfigured = false;

    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isFirebaseConfigured = true;
      } catch (e) { console.error("Firebase failed:", e); }
    }

    let currentUser = localStorage.getItem('cleanDeckUser') || 'Someone';
    document.getElementById('current-user-display').innerText = currentUser;

    let localTasks = [];
    let currentFirestoreTasks = [];
    let completedLogs = [];
    let currentCalDate = new Date();

    function openUserModal() {
      document.getElementById('user-name-input').value = currentUser === 'Someone' ? '' : currentUser;
      document.getElementById('user-modal').classList.add('active');
    }

    function handleUserSubmit(e) {
      e.preventDefault();
      const newName = document.getElementById('user-name-input').value.trim();
      if (newName) {
        currentUser = newName;
        localStorage.setItem('cleanDeckUser', currentUser);
        document.getElementById('current-user-display').innerText = currentUser;
      }
      closeModals();
    }

    function calculateTaskStats(task) {
      const today = new Date(); today.setHours(0,0,0,0);
      const lastDone = new Date(task.lastDone); lastDone.setHours(0,0,0,0);
      
      const daysElapsed = Math.floor((today - lastDone) / (1000 * 60 * 60 * 24));
      const daysOverdue = daysElapsed - task.interval;
      const overdueRatio = daysElapsed / Math.max(1, task.interval);
      const isHighPriority = !!task.isHighPriority;

      return { ...task, daysElapsed, daysOverdue, overdueRatio, isHighPriority };
    }

    function sortTasks(tasks) {
      return tasks
        .map(calculateTaskStats)
        .sort((a, b) => {
          const aIsHighOverdue = a.isHighPriority && a.daysOverdue > 0;
          const bIsHighOverdue = b.isHighPriority && b.daysOverdue > 0;

          if (aIsHighOverdue && !bIsHighOverdue) return -1;
          if (!aIsHighOverdue && bIsHighOverdue) return 1;

          return b.overdueRatio - a.overdueRatio;
        });
    }

    function render() {
      const tasksToRender = isFirebaseConfigured ? currentFirestoreTasks : localTasks;
      const sorted = sortTasks(tasksToRender);
      renderTaskList('top-3-list', sorted.slice(0, 3));
      renderTaskList('all-tasks-list', sorted.slice(3));
      lucide.createIcons();
    }

    function renderTaskList(containerId, tasks) {
      const container = document.getElementById(containerId);
      if (tasks.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:#64748b; font-size:0.9rem;">No chores here! Tap <strong>Bulk Add</strong> to paste your tasks.</div>`;
        return;
      }

      container.innerHTML = tasks.map(t => {
        const priorityStar = t.isHighPriority ? `<span style="color: #f59e0b; margin-right: 4px;">★</span>` : '';

        return `
          <div class="task-card">
            <div class="task-info">
              <div class="task-title">${priorityStar}${t.name}</div>
              <div class="task-meta">
                <button class="action-icon-btn" onclick="openEditModal('${t.id}')"><i data-lucide="pencil" style="width:14px;"></i> Edit Details</button>
                <button class="action-icon-btn" onclick="deleteTask('${t.id}')"><i data-lucide="trash-2" style="width:14px;"></i> Delete</button>
              </div>
            </div>
            <button class="complete-btn" onclick="completeTask('${t.id}')"><i data-lucide="check"></i> Done</button>
          </div>
        `;
      }).join('');
    }

    async function backfillExistingTaskLogs(tasks) {
      if (!isFirebaseConfigured || tasks.length === 0) return;
      
      const snapshot = await db.collection('logs').get();
      const existingLogs = snapshot.docs.map(doc => doc.data());
      const batch = db.batch();
      let hasNewLogs = false;

      tasks.forEach(task => {
        const hasLog = existingLogs.some(log => log.taskId === task.id && log.date === task.lastDone);
        if (!hasLog && task.lastDone) {
          const logRef = db.collection('logs').doc();
          batch.set(logRef, { taskId: task.id, name: task.name, date: task.lastDone, completedBy: 'Initial Setup' });
          hasNewLogs = true;
        }
      });

      if (hasNewLogs) {
        await batch.commit();
      }
    }

    async function completeTask(id) {
      if (currentUser === 'Someone') {
        openUserModal();
        return;
      }

      const todayStr = new Date().toISOString().split('T')[0];
      const tasks = isFirebaseConfigured ? currentFirestoreTasks : localTasks;
      const task = tasks.find(t => t.id === id);

      if (isFirebaseConfigured) {
        await db.collection('chores').doc(id).update({ lastDone: todayStr, lastDoneBy: currentUser });
        if (task) {
          await db.collection('logs').add({ taskId: id, name: task.name, date: todayStr, completedBy: currentUser });
        }
      } else {
        if (task) {
          task.lastDone = todayStr;
          task.lastDoneBy = currentUser;
          completedLogs.push({ taskId: id, name: task.name, date: todayStr, completedBy: currentUser });
        }
        render();
      }
    }

    async function handleSingleSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('edit-task-id').value;
      const name = document.getElementById('task-name').value;
      const interval = parseInt(document.getElementById('task-interval').value);
      const lastDone = document.getElementById('task-lastdone').value;
      const isHighPriority = document.getElementById('task-priority').checked;

      if (id) {
        if (isFirebaseConfigured) { 
          await db.collection('chores').doc(id).update({ name, interval, lastDone, isHighPriority }); 
        } else { 
          const t = localTasks.find(x => x.id === id); 
          if (t) Object.assign(t, { name, interval, lastDone, isHighPriority }); 
          render(); 
        }
      } else {
        if (isFirebaseConfigured) { 
          const newDoc = await db.collection('chores').add({ name, interval, lastDone, isHighPriority }); 
          await db.collection('logs').add({ taskId: newDoc.id, name, date: lastDone, completedBy: currentUser });
        } else { 
          const newId = Date.now().toString();
          localTasks.push({ id: newId, name, interval, lastDone, isHighPriority }); 
          completedLogs.push({ taskId: newId, name, date: lastDone, completedBy: currentUser });
          render(); 
        }
      }
      closeModals();
    }

    async function handleBulkSubmit(e) {
      e.preventDefault();
      const rawNames = document.getElementById('bulk-names').value;
      const interval = parseInt(document.getElementById('bulk-interval').value);
      const lastDone = document.getElementById('bulk-lastdone').value;
      const isHighPriority = document.getElementById('bulk-priority').checked;

      const names = rawNames.split('\n').map(n => n.trim()).filter(n => n.length > 0);

      if (isFirebaseConfigured) {
        const batch = db.batch();
        names.forEach(name => {
          const docRef = db.collection('chores').doc();
          const logRef = db.collection('logs').doc();
          
          batch.set(docRef, { name, interval, lastDone, isHighPriority });
          batch.set(logRef, { taskId: docRef.id, name, date: lastDone, completedBy: currentUser });
        });
        await batch.commit();
      } else {
        names.forEach(name => {
          const newId = Math.random().toString();
          localTasks.push({ id: newId, name, interval, lastDone, isHighPriority });
          completedLogs.push({ taskId: newId, name, date: lastDone, completedBy: currentUser });
        });
        render();
      }
      closeModals();
    }

    async function deleteTask(id) {
      if (!confirm("Delete this chore?")) return;
      if (isFirebaseConfigured) { await db.collection('chores').doc(id).delete(); }
      else { localTasks = localTasks.filter(t => t.id !== id); render(); }
    }

    function openEditModal(id) {
      const tasks = isFirebaseConfigured ? currentFirestoreTasks : localTasks;
      const t = tasks.find(x => x.id === id);
      if (!t) return;

      document.getElementById('edit-task-id').value = t.id;
      document.getElementById('task-name').value = t.name;
      document.getElementById('task-interval').value = t.interval;
      document.getElementById('task-lastdone').value = t.lastDone;
      document.getElementById('task-priority').checked = !!t.isHighPriority;
      document.getElementById('modal-title').innerText = "Edit Chore";
      document.getElementById('single-modal').classList.add('active');
    }

    function openSingleModal() {
      document.getElementById('single-form').reset();
      document.getElementById('edit-task-id').value = '';
      document.getElementById('task-lastdone').value = new Date().toISOString().split('T')[0];
      document.getElementById('task-priority').checked = false;
      document.getElementById('modal-title').innerText = "Add New Chore";
      document.getElementById('single-modal').classList.add('active');
    }

    function openBulkModal() {
      document.getElementById('bulk-lastdone').value = new Date().toISOString().split('T')[0];
      document.getElementById('bulk-priority').checked = false;
      document.getElementById('bulk-modal').classList.add('active');
    }

    function openCalendarModal() {
      if (isFirebaseConfigured) {
        db.collection('logs').get().then(snapshot => {
          completedLogs = snapshot.docs.map(doc => doc.data());
          renderCalendar();
        });
      } else {
        renderCalendar();
      }
      document.getElementById('calendar-modal').classList.add('active');
    }

    function changeMonth(delta) {
      currentCalDate.setMonth(currentCalDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      document.getElementById('calendar-month-year').innerText = `${monthNames[month]} ${year}`;

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = ['S','M','T','W','T','F','S'].map(d => `<div style="font-weight:700; color:var(--text-muted); padding:4px;">${d}</div>`).join('');

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayLogs = completedLogs.filter(l => l.date === dateStr);
        const hasLogs = dayLogs.length > 0;

        grid.innerHTML += `
          <div onclick="showDayLogs('${dateStr}')" style="padding: 8px 2px; border-radius: 8px; cursor: pointer; background: ${hasLogs ? 'var(--primary-light)' : 'transparent'}; font-weight: ${hasLogs ? '700' : '400'}; color: ${hasLogs ? 'var(--primary)' : 'inherit'};">
            ${day}
            ${hasLogs ? `<div style="font-size: 0.6rem; color: var(--primary);">● ${dayLogs.length}</div>` : ''}
          </div>
        `;
      }
      lucide.createIcons();
    }

    function showDayLogs(dateStr) {
      const dayLogs = completedLogs.filter(l => l.date === dateStr);
      document.getElementById('selected-date-title').innerText = `Completed on ${dateStr}:`;
      
      if (dayLogs.length === 0) {
        document.getElementById('selected-date-tasks').innerText = "No chores refreshed on this day.";
      } else {
        document.getElementById('selected-date-tasks').innerHTML = dayLogs.map(l => {
          const userStr = l.completedBy ? ` <span style="color:var(--primary); font-weight:600;">(by ${l.completedBy})</span>` : '';
          return `• ${l.name}${userStr}`;
        }).join('<br>');
      }
    }

    function closeModals() {
      document.getElementById('user-modal').classList.remove('active');
      document.getElementById('single-modal').classList.remove('active');
      document.getElementById('bulk-modal').classList.remove('active');
      document.getElementById('calendar-modal').classList.remove('active');
    }

    const cachedTasks = localStorage.getItem('cleanDeckCache');
    if (cachedTasks) {
      try {
        currentFirestoreTasks = JSON.parse(cachedTasks);
        render();
      } catch (e) { console.error(e); }
    }

    if (isFirebaseConfigured) {
      db.collection('chores').onSnapshot(snapshot => {
        currentFirestoreTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        localStorage.setItem('cleanDeckCache', JSON.stringify(currentFirestoreTasks));
        render();
        backfillExistingTaskLogs(currentFirestoreTasks);
      });
    } else { render(); }

    let showAll = false;
    function toggleAllTasks() {
      showAll = !showAll;
      document.getElementById('all-tasks-container').style.display = showAll ? 'block' : 'none';
      document.getElementById('toggle-text').innerText = showAll ? 'Hide Full List' : 'Show All Other Tasks';
    }
  </script>
</body>
</html>
